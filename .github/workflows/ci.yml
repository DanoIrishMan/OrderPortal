name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure environment
        run: |
          cat >> .env <<EOF
          DATABASE_URL="file:./dev.db"
          NEXTAUTH_URL="http://localhost:3000"
          NEXTAUTH_SECRET="ci-build-secret-change-in-production"
          UPLOAD_DIR="./uploads"
          EOF

      - name: Prepare database
        run: npx prisma db push

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
